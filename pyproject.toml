[project]
name = "trialradar"
version = "0.1.0"
description = "Local clinical-trial matching for doctors and their AI assistants"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "httpx>=0.27",
  "pydantic>=2.6",
  "mcp>=1.9,<2",
  "python-multipart>=0.0.12",
  "pytesseract>=0.3.13",
  "pillow>=10.4",
  "pypdf>=5.0",
  "fpdf2>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
trialradar = "trialradar.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
